<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F7F5">

  <title>STUDIO PLASH — Space & Brand Design</title>
  <meta name="description" content="STUDIO PLASH는 브랜드 전략부터 공간 기획, 인테리어, 시각 디자인까지 브랜드의 경험을 설계합니다.">

  <link rel="stylesheet"

  <style>
    :root {
      --paper: #F7F7F5;
      --white: #FFFFFF;
      --ink: #242424;
      --gray: #888A8D;
      --line: #DEDEDB;
      --muted: #686A6D;
      --max-width: 1440px;
      --page-padding: clamp(20px, 5.2vw, 80px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo",
                   "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--gray);
      outline-offset: 4px;
    }

    img {
      display: block;
      width: 100%;
    }

    .wrap {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--page-padding);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .muted {
      color: var(--muted);
    }

    /* HEADER */

    .header {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 82px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .logo span {
      font-weight: 400;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3vw, 42px);
      font-size: 12px;
    }

    .nav a {
      transition: opacity .2s ease;
    }

    .nav a:hover {
      opacity: .55;
    }

    .hero {
      padding-top: clamp(70px, 11vw, 160px);
      padding-bottom: clamp(65px, 10vw, 130px);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
